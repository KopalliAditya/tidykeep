# Generates Tidykeep.xcodeproj. After editing, run: xcodegen generate
name: Tidykeep
options:
  bundleIdPrefix: com.kopalliaditya
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Your 10-character team ID. Set it here: a team picked in Xcode is lost the next
    # time the project is regenerated.
    DEVELOPMENT_TEAM: ""
packages:
  TidykeepKit:
    path: TidykeepKit
targets:
  Tidykeep:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: TidykeepKit
        product: TidykeepUI
      - package: TidykeepKit
        product: TidykeepVision
      - package: TidykeepKit
        product: TidykeepPhotoKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Tidykeep
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.photography
        NSPhotoLibraryUsageDescription: >-
          Tidykeep looks through the photos on this iPhone to find near-identical shots and
          suggest the best one to keep. When you choose, it moves the extras to Recently
          Deleted. Tidykeep never sends your photos anywhere.
        NSContactsUsageDescription: >-
          Tidykeep compares your contacts on this iPhone to find duplicates you can merge.
        PHPhotoLibraryPreventAutomaticLimitedAccessAlert: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kopalliaditya.tidykeep
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_EMIT_LOC_STRINGS: YES
schemes:
  Tidykeep:
    build:
      targets:
        Tidykeep: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: TidykeepKit/TidykeepCoreTests
        - package: TidykeepKit/TidykeepVisionTests
        - package: TidykeepKit/TidykeepScanTests
    archive:
      config: Release
